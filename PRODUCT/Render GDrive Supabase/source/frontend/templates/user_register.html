<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - QA Confirm Gate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="h-screen flex items-center justify-center p-4">
    <div class="border-box p-8 w-full max-w-md shadow-xl">
        <div class="flex items-center justify-center space-x-3 mb-6">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            <span class="text-2xl font-bold tracking-wide">Register</span>
        </div>
        <form action="/register" method="POST" class="space-y-4">
            <div>
                <label class="form-label">Full Name (no accents)</label>
                <input type="text" name="fullname" required pattern="[a-zA-Z\s]+" title="Only letters and spaces allowed" class="form-input">
            </div>
            <div>
                <label class="form-label">Email</label>
                <input type="email" name="email" required class="form-input">
            </div>
            {% if not active_teams %}
            <div class="bg-amber-50 border border-amber-200 text-amber-800 text-xs p-3 rounded mb-3 font-medium">
                ⚠️ Chưa có phòng ban nào được tạo. Vui lòng liên hệ Admin (ADMINPNX) để khởi tạo phòng ban trước khi đăng ký.
            </div>
            {% endif %}
            <div>
                <label class="form-label">Team</label>
                <select name="team" required class="form-input">
                    {% if active_teams %}
                    <option value="" disabled selected>Select a department</option>
                    {% for team in active_teams %}
                    <option value="{{ team.name }}">{{ team.name }}</option>
                    {% endfor %}
                    {% else %}
                    <option value="" disabled selected>Chưa có phòng ban (Liên hệ Admin)</option>
                    {% endif %}
                </select>
            </div>
            <div>
                <label class="form-label">Employee ID (Username)</label>
                <input type="text" name="username" required class="form-input">
                {% if error %}
                <p class="text-red-600 text-xs mt-1 font-bold">{{ error }}</p>
                {% endif %}
            </div>
            <div>
                <label class="form-label">Password</label>
                <input type="password" name="password" required class="form-input">
            </div>
            <button type="submit" class="w-full btn-primary py-2 mt-6">
                Create Account
            </button>
        </form>
        <p class="mt-4 text-center text-sm font-medium text-gray-600">
            Already have an account? <a href="/login" class="text-blue-600 hover:underline">Login</a>
        </p>
    </div>
</body>
</html>
