<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - QA Confirm Gate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="h-screen flex items-center justify-center p-4">
    <div class="border-box p-8 w-full max-w-sm shadow-xl">
        <div class="flex items-center justify-center space-x-3 mb-6">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            <span class="text-2xl font-bold tracking-wide">Login</span>
        </div>
        {% if error %}
        <div class="bg-red-100 text-red-600 border border-red-300 rounded-md p-3 mb-4 text-sm text-center font-bold">
            {{ error }}
        </div>
        {% endif %}
        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="form-label">Employee ID</label>
                <input type="text" name="username" required class="form-input">
            </div>
            <div>
                <label class="form-label">Password</label>
                <input type="password" name="password" required class="form-input">
            </div>
            <button type="submit" class="w-full btn-primary py-2 mt-6">
                Sign In
            </button>
        </form>
        <p class="mt-4 text-center text-sm font-medium text-gray-600">
            New user? <a href="/register" class="text-blue-600 hover:underline">Register</a>
        </p>
    </div>
</body>
</html>
